version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: ewaste_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: EWasteDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend/EWasteManagement.API
      dockerfile: Dockerfile
    container_name: ewaste_backend
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=EWasteDb;Username=postgres;Password=postgres123
      - ASPNETCORE_ENVIRONMENT=Production
    ports:
      - "5000:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data: